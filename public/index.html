<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OneDrive - Sign In</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }
    ::selection {
      background-color: #0052cc;
      color: #ffffff;
    }
   .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-wrapper {
      margin-bottom: 2rem;
      display: flex;
      justify-content: center;
    }
    @media (min-width: 768px) {
      .logo-wrapper {
        margin-bottom: 3.5rem;
      }
    }
    /* Editable <img> tag for the logo */
    #brand-logo {
      width: 180px;
      height: 126px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      user-select: none;
    }
    @media (max-width: 640px) {
      #brand-logo {
        width: 160px;
        height: 112px;
      }
    }
    .form-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      color: #000000;
      margin-bottom: 1.25rem;
      line-height: 1.25;
      user-select: none;
    }
    @media (max-width: 640px) {
      h1 {
        font-size: 22px;
        margin-bottom: 0.75rem;
      }
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      font-size: 16px;
      font-family: inherit;
      color: #000000;
      background-color: #ffffff;
      border: 1px solid #8a8886;
      border-radius: 2px;
      outline: none;
      transition: border-color 0.15s ease-in-out;
      margin-bottom: 1rem;
    }
    input[type="email"]::placeholder,
    input[type="password"]::placeholder {
      color: #757575;
      opacity: 1;
    }
    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #0052cc;
      box-shadow: 0 0 0 1px #0052cc;
    }
    .btn-login {
      width: 100%;
      height: 50px;
      margin-top: 0.5rem;
      background-color: #0052cc;
      color: #ffffff;
      font-size: 17px;
      font-weight: 500;
      font-family: inherit;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
    }
    .btn-login:hover {
      background-color: #0047b3;
    }
    .btn-login:active {
      background-color: #003d99;
    }
    .btn-login:disabled {
      opacity: 0.75;
      cursor: not-allowed;
    }
    .footer-links {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      color: #0066cc;
      margin-top: 1.5rem;
      user-select: none;
    }
    .footer-links label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #333333;
      font-size: 14px;
    }
    .footer-links input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #0052cc;
      cursor: pointer;
      margin-bottom: 0;
    }
    .footer-links a {
      color: #0066cc;
      text-decoration: none;
      font-size: 14px;
    }
    .footer-links a:hover {
      text-decoration: underline;
    }
    .terms {
      font-size: 14px;
      color: #555555;
      margin-top: 1.25rem;
      line-height: 1.4;
    }
    .terms a {
      color: #0052cc;
      text-decoration: none;
    }
    .terms a:hover {
      text-decoration: underline;
    }
  </style>
</head>
